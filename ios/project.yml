# XcodeGen spec for the Ghost Chef iOS app.
# Generate the project with:  xcodegen generate   (the .xcodeproj is not committed)
name: GhostChef

options:
  bundleIdPrefix: com.ghostchef
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  GhostChef:
    type: application
    platform: iOS
    sources:
      - path: GhostChef
        excludes:
          - "Resources/Fixtures"
          - "Info.plist"
      # Folder reference so the bundle keeps the Fixtures/ (and Fixtures/images/) layout.
      - path: GhostChef/Resources/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GHOSTCHEF_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: GhostChef/Info.plist
      properties:
        CFBundleDisplayName: Ghost Chef
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # UIBackgroundModes: intentionally absent until IOS-02 adds what the DAT SDK docs require.
        NSCameraUsageDescription: Ghost Chef looks at your cutting board through the camera to check each cooking step against the chef's reference.
        NSMicrophoneUsageDescription: Ghost Chef listens when you ask a question about the recipe so it can answer by voice.
        NSBluetoothAlwaysUsageDescription: Ghost Chef connects to your Meta glasses over Bluetooth to show steps in the lens and receive gestures.
        NSLocalNetworkUsageDescription: Ghost Chef talks to the team's development server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Defaults for the Settings screen; come from Config/Config.xcconfig and Secrets.xcconfig.
        APIBaseURL: $(API_BASE_URL)
        DemoAPIKey: $(DEMO_API_KEY)

  GhostChefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GhostChefTests
    dependencies:
      - target: GhostChef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GHOSTCHEF_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GhostChef:
    build:
      targets:
        GhostChef: all
        GhostChefTests: [test]
    test:
      targets:
        - GhostChefTests
