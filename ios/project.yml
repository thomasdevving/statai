# XcodeGen spec for the Ghost Chef iOS app.
# Generate the project with:  xcodegen generate   (the .xcodeproj is not committed)
name: GhostChef

options:
  bundleIdPrefix: com.ghostchef
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  # Meta Wearables Device Access Toolkit. Pinned to an exact version (ios/README.md rule);
  # the version actually used is recorded in ios/STATUS.md.
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  GhostChef:
    type: application
    platform: iOS
    sources:
      - path: GhostChef
        excludes:
          - "Resources/Fixtures"
          - "Info.plist"
      # Folder reference so the bundle keeps the Fixtures/ (and Fixtures/images/) layout.
      - path: GhostChef/Resources/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATMockDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GHOSTCHEF_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: GhostChef/Info.plist
      properties:
        CFBundleDisplayName: Ghost Chef
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # --- Meta Wearables DAT (IOS-02), per the SDK 1.0.1 getting-started guide ---
        # URL scheme Meta AI calls back after registration and permission flows.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - ghostchef
        MWDAT:
          AppLinkURLScheme: "ghostchef://"
          # Empty / unexpanded values keep the SDK in Developer Mode (no attestation).
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        # Bluetooth LE + Bluetooth Classic (camera streaming) links.
        UIBackgroundModes:
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        # Wi-Fi (high bandwidth) link.
        NSBonjourServices:
          - _bonjour._tcp
        NSCameraUsageDescription: Ghost Chef looks at your cutting board through the camera to check each cooking step against the chef's reference.
        NSMicrophoneUsageDescription: Ghost Chef listens when you ask a question about the recipe, and records the chef's voice in Chef mode.
        NSBluetoothAlwaysUsageDescription: Ghost Chef connects to your Meta glasses over Bluetooth to show steps in the lens and receive gestures.
        NSLocalNetworkUsageDescription: Ghost Chef connects to your glasses over Wi-Fi and talks to the team's development server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Defaults for the Settings screen; come from Config/Config.xcconfig and Secrets.xcconfig.
        APIBaseURL: $(API_BASE_URL)
        DemoAPIKey: $(DEMO_API_KEY)

  GhostChefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GhostChefTests
    dependencies:
      - target: GhostChef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GHOSTCHEF_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GhostChef:
    build:
      targets:
        GhostChef: all
        GhostChefTests: [test]
    test:
      targets:
        - GhostChefTests
