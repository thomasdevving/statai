[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostchef-ai"
version = "0.1.0"
description = "Ghost Chef: every prompt and Gemini call, plus fake mode for development"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
# Temporary development stand-in while Gemini access is pending. Not needed by backend/.
openai = ["openai>=2"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pillow",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghostchef_ai = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
